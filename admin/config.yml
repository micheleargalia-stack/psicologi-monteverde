backend:
  name: git-gateway
  branch: main

media_folder: "images/articoli"
public_folder: "/images/articoli"

collections:
  - name: "dizionario"
    label: "Dizionario Psy"
    label_singular: "Voce del dizionario"
    folder: "content/dizionario"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Meta-descrizione (per Google, 1-2 frasi)", name: "metaDescription", widget: "text" }
      - { label: "Testo", name: "body", widget: "markdown" }
      - { label: "Nascondi dai motori di ricerca", name: "hideFromSearch", widget: "boolean", default: false }
