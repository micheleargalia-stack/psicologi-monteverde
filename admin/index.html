<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Psicologi Monteverde</title>
  <style>
    body { font-family: sans-serif; background:#E8E3D8; color:#202B23; margin:0; padding:60px 20px; box-sizing:border-box; }
    #login-box { max-width: 360px; margin: 0 auto; text-align:center; }
    #login-box h1 { font-size: 20px; margin-bottom: 24px; }
    #status-text { margin-bottom: 18px; color:#5B6459; }
    #status-text.err { color:#A1553A; font-weight:bold; }
    input { width:100%; box-sizing:border-box; padding:11px 13px; margin-bottom:12px; border:1px solid #C9C2AC; border-radius:4px; font-size:16px; }
    button { width:100%; font-family:sans-serif; font-size:16px; padding:12px 24px; background:#43512F; color:#F5F2EA; border:none; border-radius:4px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    #relogin-btn { margin-top:24px; background:transparent; color:#5B6459; border:1px solid #C9C2AC; font-size:13px; padding:8px 16px; }
  </style>
</head>
<body>
  <div id="login-box">
    <h1>Psicologi Monteverde — Admin</h1>
    <p id="status-text">Caricamento…</p>

    <form id="login-form" style="display:none;">
      <input type="email" id="email" placeholder="Email" required autocomplete="username">
      <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
      <button type="submit" id="submit-btn">Accedi</button>
    </form>
    <p id="forgot-wrap" style="display:none;margin-top:4px;">
      <a href="#" id="forgot-link" style="font-family:sans-serif;font-size:13px;color:#5B6459;">Password dimenticata o mai impostata?</a>
    </p>

    <form id="setpass-form" style="display:none;">
      <p style="font-family:sans-serif;font-size:14px;color:#5B6459;margin:0 0 14px;">Crea la tua password per accedere al pannello.</p>
      <input type="password" id="new-password" placeholder="Nuova password (almeno 6 caratteri)" required minlength="6" autocomplete="new-password">
      <button type="submit" id="setpass-btn">Salva password e accedi</button>
    </form>

    <button id="relogin-btn" style="display:none;">Esci e riprova (sessione bloccata)</button>
  </div>

  <!-- Visibile solo dopo l'accesso: la mappa del sito elenca anche le bozze non pubblicate -->
  <a id="mappa-link" href="/admin/mappa.html" style="display:none;position:fixed;top:14px;right:16px;z-index:999;font-family:sans-serif;font-size:13px;color:#5B6459;background:#F5F2EA;border:1px solid #C9C2AC;padding:6px 12px;border-radius:4px;text-decoration:none;">🗺️ Mappa del sito</a>

  <!-- Impedisce a Decap CMS di caricarsi da solo: lo avviamo noi dopo aver letto il ruolo -->
  <script>window.CMS_MANUAL_INIT = true;</script>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    const statusText = document.getElementById('status-text');
    const loginForm = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const reloginBtn = document.getElementById('relogin-btn');
    const forgotWrap = document.getElementById('forgot-wrap');
    const forgotLink = document.getElementById('forgot-link');
    const setpassForm = document.getElementById('setpass-form');
    const setpassBtn = document.getElementById('setpass-btn');

    function setStatus(msg, isError) {
      statusText.textContent = msg;
      statusText.className = isError ? 'err' : '';
    }

    // Quali collezioni può vedere ogni ruolo.
    // "admin" vede sempre tutto, qualunque altra collezione venga aggiunta in futuro.
    const ROLE_ACCESS = {
      admin:  null, // null = nessuna restrizione, vede tutte le collezioni
      editor: ['pagine', 'servizi', 'dizionario', 'articoli', 'documenti', 'pagine-libere'],
      autore: ['articoli']
    };

    function getAllowedCollections(roles) {
      if (!roles || roles.length === 0) return [];
      if (roles.includes('admin')) return null;
      let allowed = new Set();
      roles.forEach(r => {
        if (ROLE_ACCESS[r]) ROLE_ACCESS[r].forEach(c => allowed.add(c));
      });
      return Array.from(allowed);
    }

    // Netlify Identity può segnalare l'utente loggato più di una volta per lo
    // stesso accesso (es. sia dal submit del form sia dall'evento 'init' del
    // widget). Decap CMS non tollera un secondo CMS.init() nella stessa
    // pagina — questa guardia impedisce che startCMS() lo avvii due volte.
    let cmsInitialized = false;

    async function startCMS(user) {
      // Va impostato QUI, subito, prima di qualunque await: se lo si
      // imposta più avanti (es. dopo la fetch del config.yml) due chiamate
      // ravvicinate a startCMS() passano entrambe il controllo prima che la
      // prima abbia segnato "avviato", e la corsa non viene bloccata — è
      // esattamente quello che causava il doppio CMS.init().
      if (cmsInitialized) return;
      cmsInitialized = true;

      // Normalizzato in minuscolo: su Netlify il ruolo può essere digitato
      // "Admin", "ADMIN", ecc. — il confronto non deve dipendere da questo.
      const roles = ((user && user.app_metadata && user.app_metadata.roles) || []).map(r => String(r).trim().toLowerCase());
      const allowed = getAllowedCollections(roles);

      if (allowed !== null && allowed.length === 0) {
        setStatus('Il tuo utente non ha ancora un ruolo assegnato, oppure la sessione è obsoleta.', true);
        loginForm.style.display = 'none';
        reloginBtn.style.display = 'block';
        return;
      }

      try {
        const yamlText = await (await fetch('/admin/config.yml')).text();
        const config = jsyaml.load(yamlText);
        if (allowed !== null) {
          config.collections = config.collections.filter(c => allowed.includes(c.name));
        }
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('mappa-link').style.display = 'block';
        // Il widget Identity aggiunge un iframe a schermo intero (nascosto,
        // usato solo per il suo popup di login che qui non impieghiamo mai)
        // che entra in conflitto col rendering di Decap CMS e causa un
        // crash "removeChild" all'avvio. Non serve più da qui in poi: via.
        const identityIframe = document.getElementById('netlify-identity-widget');
        if (identityIframe) identityIframe.remove();
        CMS.init({ config });
      } catch (e) {
        setStatus('Errore nel caricamento del pannello: ' + e.message, true);
      }
    }

    reloginBtn.addEventListener('click', () => {
      window.netlifyIdentity.logout().then(() => location.reload());
    });

    // Chi non ha mai impostato una password (nuovo utente invitato) o l'ha
    // dimenticata può farsi mandare un link per crearne una — senza questo
    // il form di login sopra non ha nulla con cui verificare l'accesso.
    forgotLink.addEventListener('click', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      if (!email) {
        setStatus('Scrivi prima la tua email qui sopra, poi clicca di nuovo su questo link.', true);
        return;
      }
      forgotLink.textContent = 'Invio in corso…';
      window.netlifyIdentity.gotrue.requestPasswordRecovery(email)
        .then(() => {
          setStatus('Email inviata: controlla la posta (anche lo spam) e clicca il link per creare la password.', false);
          forgotLink.textContent = 'Password dimenticata o mai impostata?';
        })
        .catch(err => {
          setStatus('Invio non riuscito: ' + (err.message || 'riprova.'), true);
          forgotLink.textContent = 'Password dimenticata o mai impostata?';
        });
    });

    // Gestisce i link di invito (#invite_token=...) e di recupero password
    // (#recovery_token=...) con questa stessa pagina invece che con il popup
    // standard di Netlify Identity, che si è dimostrato inaffidabile.
    let pendingInviteToken = null;
    let pendingRecoveredUser = null;

    function showSetPasswordForm() {
      loginForm.style.display = 'none';
      forgotWrap.style.display = 'none';
      setpassForm.style.display = 'block';
    }

    function handleAuthTokenInHash() {
      const match = (location.hash || '').match(/(confirmation|invite|recovery|email_change)_token=([^&]+)/);
      if (!match) return false;
      const [, type, token] = match;
      location.hash = '';

      if (type === 'invite') {
        pendingInviteToken = token;
        setStatus('', false);
        showSetPasswordForm();
        return true;
      }

      if (type === 'recovery') {
        setStatus('Verifico il link…', false);
        window.netlifyIdentity.gotrue.recover(token, true)
          .then(user => {
            pendingRecoveredUser = user;
            setStatus('', false);
            showSetPasswordForm();
          })
          .catch(err => {
            setStatus('Link non valido o scaduto: ' + (err.message || 'richiedine uno nuovo.'), true);
            loginForm.style.display = 'block';
            forgotWrap.style.display = 'block';
          });
        return true;
      }

      return false;
    }

    setpassForm.addEventListener('submit', (e) => {
      e.preventDefault();
      setpassBtn.disabled = true;
      setpassBtn.textContent = 'Salvataggio…';
      const newPassword = document.getElementById('new-password').value;

      const action = pendingInviteToken
        ? window.netlifyIdentity.gotrue.acceptInvite(pendingInviteToken, newPassword, true)
        : pendingRecoveredUser.update({ password: newPassword });

      action
        .then(user => {
          setStatus('Password creata, accesso in corso…', false);
          startCMS(user);
        })
        .catch(err => {
          setStatus('Non sono riuscito a salvare la password: ' + (err.message || 'riprova.'), true);
          setpassBtn.disabled = false;
          setpassBtn.textContent = 'Salva password e accedi';
        });
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Accesso in corso…';
      setStatus('', false);
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      window.netlifyIdentity.gotrue.login(email, password, true)
        .then(user => {
          setStatus('Accesso riuscito, carico il pannello…', false);
          startCMS(user);
        })
        .catch(err => {
          setStatus('Accesso non riuscito: ' + (err.message || 'email o password errati.'), true);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Accedi';
        });
    });

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', user => {
        if (handleAuthTokenInHash()) return;
        if (user) {
          setStatus('Sessione trovata, verifico l\'accesso…', false);
          startCMS(user);
        } else {
          setStatus('Inserisci le tue credenziali per accedere.', false);
          loginForm.style.display = 'block';
          forgotWrap.style.display = 'block';
        }
      });
      window.netlifyIdentity.on('error', err => {
        setStatus('Errore del sistema di login: ' + (err && err.message ? err.message : String(err)), true);
        loginForm.style.display = 'block';
        forgotWrap.style.display = 'block';
      });
      window.netlifyIdentity.init();
      // Se dopo 6 secondi non è successo nulla (script non inizializzato), mostra comunque il modulo
      setTimeout(() => {
        const nothingShown = loginForm.style.display === 'none' && setpassForm.style.display === 'none';
        if (nothingShown && document.getElementById('login-box').style.display !== 'none') {
          setStatus('Inserisci le tue credenziali per accedere.', false);
          loginForm.style.display = 'block';
          forgotWrap.style.display = 'block';
        }
      }, 6000);
    } else {
      setStatus('Il sistema di login non si è caricato. Ricarica la pagina o riprova tra poco.', true);
    }
  </script>
</body>
</html>
