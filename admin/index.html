<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Psicologi Monteverde</title>
  <style>
    body { font-family: sans-serif; background:#E8E3D8; color:#202B23; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    #loading-msg { text-align:center; max-width: 360px; }
  </style>
</head>
<body>
  <div id="loading-msg">
    <p id="status-text">Caricamento…</p>
    <button id="login-btn" style="display:none;font-family:sans-serif;font-size:16px;padding:12px 24px;background:#43512F;color:#F5F2EA;border:none;border-radius:4px;cursor:pointer;margin-top:12px;">Accedi</button>
  </div>

  <!-- Impedisce a Decap CMS di caricarsi da solo: lo avviamo noi dopo aver letto il ruolo -->
  <script>window.CMS_MANUAL_INIT = true;</script>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.umd.min.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    const statusText = document.getElementById('status-text');

    // Quali collezioni può vedere ogni ruolo.
    // "admin" vede sempre tutto, qualunque altra collezione venga aggiunta in futuro.
    const ROLE_ACCESS = {
      admin:  null, // null = nessuna restrizione, vede tutte le collezioni
      editor: ['pagine', 'servizi', 'dizionario', 'articoli', 'documenti', 'pagine-libere'],
      autore: ['articoli']
    };

    function getAllowedCollections(roles) {
      if (!roles || roles.length === 0) return []; // nessun ruolo assegnato = nessun accesso
      if (roles.includes('admin')) return null;
      let allowed = new Set();
      roles.forEach(r => {
        if (ROLE_ACCESS[r]) ROLE_ACCESS[r].forEach(c => allowed.add(c));
      });
      return Array.from(allowed);
    }

    async function startCMS(user) {
      const roles = (user && user.app_metadata && user.app_metadata.roles) || [];
      const allowed = getAllowedCollections(roles);

      if (allowed !== null && allowed.length === 0) {
        statusText.innerHTML = 'Il tuo utente non ha ancora un ruolo assegnato.<br>Chiedi all\'amministratore di assegnartelo dalla pagina Identity di Netlify.';
        return;
      }

      const yamlText = await (await fetch('/admin/config.yml')).text();
      const config = jsyaml.load(yamlText);

      if (allowed !== null) {
        config.collections = config.collections.filter(c => allowed.includes(c.name));
      }

      document.getElementById('loading-msg').style.display = 'none';
      CMS.init({ config });
    }

    if (window.netlifyIdentity) {
      document.getElementById('login-btn').addEventListener('click', () => window.netlifyIdentity.open());
      window.netlifyIdentity.on('init', user => {
        if (user) {
          startCMS(user);
        } else {
          statusText.textContent = 'Effettua il login…';
          document.getElementById('login-btn').style.display = 'inline-block';
          window.netlifyIdentity.open();
        }
      });
      window.netlifyIdentity.on('login', user => {
        window.netlifyIdentity.close();
        startCMS(user);
      });
      window.netlifyIdentity.init();
    }
  </script>
</body>
</html>
