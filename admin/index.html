<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Psicologi Monteverde</title>
  <style>
    body { font-family: sans-serif; background:#E8E3D8; color:#202B23; margin:0; padding:60px 20px; box-sizing:border-box; }
    #login-box { max-width: 360px; margin: 0 auto; text-align:center; }
    #login-box h1 { font-size: 20px; margin-bottom: 24px; }
    #status-text { margin-bottom: 18px; color:#5B6459; }
    #status-text.err { color:#A1553A; font-weight:bold; }
    input { width:100%; box-sizing:border-box; padding:11px 13px; margin-bottom:12px; border:1px solid #C9C2AC; border-radius:4px; font-size:16px; }
    button { width:100%; font-family:sans-serif; font-size:16px; padding:12px 24px; background:#43512F; color:#F5F2EA; border:none; border-radius:4px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    #relogin-btn { margin-top:24px; background:transparent; color:#5B6459; border:1px solid #C9C2AC; font-size:13px; padding:8px 16px; }
  </style>
</head>
<body>
  <div id="login-box">
    <h1>Psicologi Monteverde — Admin</h1>
    <p id="status-text">Caricamento…</p>

    <form id="login-form" style="display:none;">
      <input type="email" id="email" placeholder="Email" required autocomplete="username">
      <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
      <button type="submit" id="submit-btn">Accedi</button>
    </form>

    <button id="relogin-btn" style="display:none;">Esci e riprova (sessione bloccata)</button>
  </div>

  <!-- Visibile solo dopo l'accesso: la mappa del sito elenca anche le bozze non pubblicate -->
  <a id="mappa-link" href="/admin/mappa.html" style="display:none;position:fixed;top:14px;right:16px;z-index:999;font-family:sans-serif;font-size:13px;color:#5B6459;background:#F5F2EA;border:1px solid #C9C2AC;padding:6px 12px;border-radius:4px;text-decoration:none;">🗺️ Mappa del sito</a>

  <!-- Impedisce a Decap CMS di caricarsi da solo: lo avviamo noi dopo aver letto il ruolo -->
  <script>window.CMS_MANUAL_INIT = true;</script>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    const statusText = document.getElementById('status-text');
    const loginForm = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const reloginBtn = document.getElementById('relogin-btn');

    function setStatus(msg, isError) {
      statusText.textContent = msg;
      statusText.className = isError ? 'err' : '';
    }

    // Quali collezioni può vedere ogni ruolo.
    // "admin" vede sempre tutto, qualunque altra collezione venga aggiunta in futuro.
    const ROLE_ACCESS = {
      admin:  null, // null = nessuna restrizione, vede tutte le collezioni
      editor: ['pagine', 'servizi', 'dizionario', 'articoli', 'documenti', 'pagine-libere'],
      autore: ['articoli']
    };

    function getAllowedCollections(roles) {
      if (!roles || roles.length === 0) return [];
      if (roles.includes('admin')) return null;
      let allowed = new Set();
      roles.forEach(r => {
        if (ROLE_ACCESS[r]) ROLE_ACCESS[r].forEach(c => allowed.add(c));
      });
      return Array.from(allowed);
    }

    async function startCMS(user) {
      // Normalizzato in minuscolo: su Netlify il ruolo può essere digitato
      // "Admin", "ADMIN", ecc. — il confronto non deve dipendere da questo.
      const roles = ((user && user.app_metadata && user.app_metadata.roles) || []).map(r => String(r).trim().toLowerCase());
      const allowed = getAllowedCollections(roles);

      if (allowed !== null && allowed.length === 0) {
        setStatus('Il tuo utente non ha ancora un ruolo assegnato, oppure la sessione è obsoleta.', true);
        loginForm.style.display = 'none';
        reloginBtn.style.display = 'block';
        return;
      }

      try {
        const yamlText = await (await fetch('/admin/config.yml')).text();
        const config = jsyaml.load(yamlText);
        if (allowed !== null) {
          config.collections = config.collections.filter(c => allowed.includes(c.name));
        }
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('mappa-link').style.display = 'block';
        CMS.init({ config });
      } catch (e) {
        setStatus('Errore nel caricamento del pannello: ' + e.message, true);
      }
    }

    reloginBtn.addEventListener('click', () => {
      window.netlifyIdentity.logout().then(() => location.reload());
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Accesso in corso…';
      setStatus('', false);
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      window.netlifyIdentity.gotrue.login(email, password, true)
        .then(user => {
          setStatus('Accesso riuscito, carico il pannello…', false);
          startCMS(user);
        })
        .catch(err => {
          setStatus('Accesso non riuscito: ' + (err.message || 'email o password errati.'), true);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Accedi';
        });
    });

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', user => {
        if (user) {
          setStatus('Sessione trovata, verifico l\'accesso…', false);
          startCMS(user);
        } else {
          setStatus('Inserisci le tue credenziali per accedere.', false);
          loginForm.style.display = 'block';
        }
      });
      window.netlifyIdentity.on('error', err => {
        setStatus('Errore del sistema di login: ' + (err && err.message ? err.message : String(err)), true);
        loginForm.style.display = 'block';
      });
      window.netlifyIdentity.init();
      // Se dopo 6 secondi non è successo nulla (script non inizializzato), mostra comunque il modulo
      setTimeout(() => {
        if (loginForm.style.display === 'none' && document.getElementById('login-box').style.display !== 'none') {
          setStatus('Inserisci le tue credenziali per accedere.', false);
          loginForm.style.display = 'block';
        }
      }, 6000);
    } else {
      setStatus('Il sistema di login non si è caricato. Ricarica la pagina o riprova tra poco.', true);
    }
  </script>
</body>
</html>
